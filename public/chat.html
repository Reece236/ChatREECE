<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Chat</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="btn btn-block" id="newChatBtn">+ New chat</button>
    </div>
    <div class="sidebar-list" id="threadList"></div>
    <div class="sidebar-foot">
      <span id="whoami">Signed in with your key</span>
      <button class="btn-ghost" id="signOutBtn" title="Sign out on this device">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn-ghost menu-btn" id="menuBtn" aria-label="Show chats">☰</button>
      <div style="min-width:0">
        <div class="topbar-title" id="chatTitle">New chat</div>
        <div class="topbar-sub" id="chatSub"></div>
      </div>
      <div class="spacer"></div>
      <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Away</span></span>
    </header>

    <div class="stream" id="stream">
      <div class="stream-inner" id="streamInner"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Ask a question…"
          autocomplete="off"
          spellcheck="true"></textarea>
        <button class="send-btn" id="sendBtn" type="submit" aria-label="Send" disabled>↑</button>
      </form>
      <div class="composer-hint" id="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>
</div>

<div class="scrim hidden" id="scrim"></div>

<script type="module" src="/js/chat.js"></script>
</body>
</html>
