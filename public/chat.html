<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Chat</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-head">
      <button class="btn" id="newChat" type="button">New question</button>
      <button class="side-close" id="closeSide" type="button" aria-label="Close list">✕</button>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <span id="who"></span>
      <button class="btn-plain" id="signOut" type="button">Sign out</button>
    </div>
  </aside>

  <div class="col">
    <header class="bar">
      <button class="icon menu" id="menu" type="button" aria-label="Your questions">☰</button>
      <h1 id="title">Chat<span class="who" id="status"></span></h1>
    </header>

    <div class="banner hide" id="notifyBar">
      <span id="notifyText"></span>
      <button class="btn" id="notifyBtn" type="button">Turn on</button>
    </div>

    <div class="stream" id="stream"><div class="wrap" id="wrap"></div></div>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Type your question" enterkeyhint="send"></textarea>
      <button type="submit" id="send" disabled>Send</button>
    </form>
  </div>
</div>

<div class="scrim hide" id="scrim"></div>

<script type="module" src="/js/chat.js"></script>
</body>
</html>
