<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Answering desk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main class="page hide" id="gate">
  <h1>Answering desk</h1>
  <p class="sub">Enter your owner key.</p>
  <form id="gateForm">
    <label for="gateKey">Owner key</label>
    <input class="field" id="gateKey" type="password" autocomplete="current-password"
           autocapitalize="none" spellcheck="false">
    <button class="btn btn-main" type="submit">Open</button>
    <p class="err hide" id="gateErr"></p>
  </form>
</main>

<div class="shell hide" id="desk">
  <aside class="side" id="side">
    <div class="side-head">
      <button class="btn" id="filter" type="button">Showing all</button>
      <button class="side-close" id="closeSide" type="button" aria-label="Close list">✕</button>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <span id="stats"></span>
      <button class="btn-plain" id="signOut" type="button">Sign out</button>
    </div>
  </aside>

  <div class="col">
    <header class="bar">
      <button class="icon menu" id="menu" type="button" aria-label="Inbox">☰</button>
      <h1 id="title">Pick a question<span class="who" id="sub"></span></h1>
      <button class="icon" id="info" type="button" aria-label="Details">•••</button>
    </header>

    <div class="banner hide" id="notifyBar">
      <span id="notifyText"></span>
      <button class="btn" id="notifyBtn" type="button">Turn on</button>
    </div>

    <div class="panel hide" id="panel">
      <h3>Private note about <span id="panelWho">this person</span></h3>
      <textarea class="field" id="note" placeholder="Only you can see this."></textarea>
      <div class="row">
        <button class="btn" id="saveNote" type="button">Save note</button>
        <button class="btn" id="block" type="button">Block</button>
        <button class="btn" id="del" type="button">Delete</button>
      </div>
      <p class="ok hide" id="panelMsg"></p>
    </div>

    <div class="stream" id="stream"><div class="wrap" id="wrap"></div></div>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Write your answer" enterkeyhint="send"></textarea>
      <button type="submit" id="send" disabled>Send</button>
    </form>
  </div>
</div>

<div class="scrim hide" id="scrim"></div>

<script type="module" src="/js/admin.js"></script>
</body>
</html>
