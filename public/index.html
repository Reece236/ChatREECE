<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sign in</title>
<meta name="description" content="Ask a question and get a real answer.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="page">
  <h1 id="title">ChatREECE</h1>
  <p class="sub" id="sub">Ask a question. A real person answers.</p>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabIn" role="tab" aria-selected="false" type="button">Sign in</button>
    <button class="tab" id="tabUp" role="tab" aria-selected="true" type="button">Create account</button>
  </div>

  <!-- Create account -->
  <form id="formUp">
    <label for="upUser">Username</label>
    <input class="field" id="upUser" name="username" type="text"
           autocomplete="username" autocapitalize="none" autocorrect="off"
           spellcheck="false" required minlength="3" maxlength="20">

    <label for="upPass">Password</label>
    <input class="field" id="upPass" name="password" type="password"
           autocomplete="new-password" required minlength="8">
    <p class="hint" id="upHint">At least 8 characters.</p>

    <button class="btn btn-main" type="submit" id="upBtn">Create account</button>
    <p class="err hide" id="upErr"></p>
  </form>

  <!-- Sign in -->
  <form id="formIn" class="hide">
    <label for="inUser">Username</label>
    <input class="field" id="inUser" name="username" type="text"
           autocomplete="username" autocapitalize="none" autocorrect="off"
           spellcheck="false" required>

    <label for="inPass">Password</label>
    <input class="field" id="inPass" name="password" type="password"
           autocomplete="current-password" required>

    <button class="btn btn-main" type="submit" id="inBtn">Sign in</button>
    <p class="err hide" id="inErr"></p>
  </form>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
