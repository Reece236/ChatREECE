# Fly.io config. Change the app name to something unique, then:
#   fly launch --copy-config --no-deploy
#   fly volumes create chatreece_data --size 1
#   fly secrets set ADMIN_KEY="your-owner-key"
#   fly deploy
app = "chatreece"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  SITE_NAME = "ChatREECE"
  OWNER_NAME = "Reece"

# Conversations, the key pepper and the generated admin key live here. Without
# this volume a deploy would take every visitor's key with it.
[[mounts]]
  source = "chatreece_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Deliberately not auto-stopping. Live delivery holds a long server-sent-events
  # connection open per visitor, and suspending the machine underneath that
  # drops it. One always-on machine also keeps SQLite to a single writer.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/config"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
