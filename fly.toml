# fly.toml app configuration file generated for chatreece on 2026-08-07T21:41:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chatreece'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  OWNER_NAME = 'Reece'
  PORT = '3000'
  SITE_NAME = 'ChatREECE'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'chatreece_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/config'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
