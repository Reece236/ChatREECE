# For a VPS or your own machine:
#   cp .env.example .env     # set ADMIN_KEY
#   docker compose up -d
#
# Put a reverse proxy (Caddy, nginx, Cloudflare Tunnel) in front for HTTPS and
# keep TRUST_PROXY=1 in .env when you do.
services:
  chatreece:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - chatreece-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  chatreece-data:
